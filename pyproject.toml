[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "windows-agent"
version = "0.6.3"
description = "Persistent provider-pluggable Windows automation with monitor leases, isolated browser input, safe overlays, model fallback, and structured evidence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Alidantech"}]
dependencies = [
  "google-genai>=2.7.0,<3.0.0",
  "keyring>=25.6.0,<26.0.0",
  "mistralai>=1.9.0,<3.0.0",
  "mss>=10.0.0,<11.0.0",
  "openai>=2.0.0,<3.0.0",
  "Pillow==11.1.0",
  "playwright>=1.54.0,<2.0.0",
  "prompt-toolkit>=3.0.52,<4.0.0",
  "pyautogui>=0.9.54,<0.10.0",
  "pyperclip>=1.9.0,<2.0.0",
  "pywinauto==0.6.8",
  "pywin32>=306",
  "psutil>=6.1.0,<8.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "python-dotenv==1.0.1",
  "PyYAML>=6.0.2,<7.0.0",
  "rich>=14.0.0,<15.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
windows-agent = "agent_os.shell_v2:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  # Embedded JavaScript and HTML are kept readable in their native structure.
  "E501",
  # Explicit nested guards and cleanup blocks are clearer in UI/process teardown paths.
  "SIM102",
  "SIM105",
]

[tool.uv]
required-version = ">=0.10.0"
