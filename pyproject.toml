[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gemini-windows-agent"
version = "0.1.0"
description = "A supervised Gemini-powered Windows desktop automation agent with saved screenshots, multi-monitor targeting, UI Automation metadata, skills, and structured logs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Alidantech"}]
dependencies = [
  "google-genai>=2.7.0,<3.0.0",
  "mss>=10.0.0,<11.0.0",
  "Pillow==11.1.0",
  "pyautogui>=0.9.54,<0.10.0",
  "pyperclip>=1.9.0,<2.0.0",
  "pywinauto==0.6.8",
  "pywin32>=306",
  "psutil>=6.1.0,<8.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "python-dotenv==1.0.1",
  "PyYAML>=6.0.2,<7.0.0",
  "rich>=14.0.0,<15.0.0",
  "typer>=0.16.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
agent-os = "agent_os.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
